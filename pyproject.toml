[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ravenbin-cli"
version = "0.2.0"
description = "Upload and download temporary files with Raven Bin"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Microck" }]
dependencies = ["playwright>=1.45"]

[project.scripts]
ravenbin = "ravenbin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
